# OpsDone uses the existing Cloud Run infrastructure. Deploy a reviewable
# revision without moving production traffic. Existing secrets/env are preserved.
steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg=NEXT_PUBLIC_SITE_URL=${_SITE_URL}
      - --build-arg=NEXT_PUBLIC_CONTACT_EMAIL=${_CONTACT_EMAIL}
      - --build-arg=SITE_LIVE=${_SITE_LIVE}
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID
      - .
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      [push, "europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID"]
  - id: deploy-preview
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - vierwochen
      - --image=europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID
      - --region=europe-west3
      - --service-account=vierwochen-app@$PROJECT_ID.iam.gserviceaccount.com
      - --no-traffic
      - --tag=opsdone-preview
      - --update-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,SITE_LIVE=${_SITE_LIVE},NEXT_PUBLIC_SITE_URL=${_SITE_URL},NEXT_PUBLIC_CONTACT_EMAIL=${_CONTACT_EMAIL}
substitutions:
  _SITE_URL: https://opsdone.de
  _CONTACT_EMAIL: hallo@vierwochen.de
  _SITE_LIVE: "0"
options:
  logging: CLOUD_LOGGING_ONLY
