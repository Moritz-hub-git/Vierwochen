# Bau und Auslieferung von vierwochen.de
#
# Laeuft bei jedem Push auf main.
# Die Artifact-Registry-Ablage "vierwochen" in europe-west3 existiert bereits;
# sie wird hier bewusst nicht mehr geprueft oder angelegt, um eine unnoetige
# Fehlerquelle zu vermeiden.
#
# Das Dienstkonto, unter dem dieser Build laeuft, braucht:
#   roles/artifactregistry.writer   (Image ablegen)
#   roles/run.admin                 (nach Cloud Run ausliefern)
#   roles/iam.serviceAccountUser    (auf dem Laufzeitkonto handeln)
#   roles/logging.logWriter         (Protokolle schreiben)

steps:
  - id: Bauen
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID
      - .

  - id: Hochladen
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID

  - id: Ausliefern
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - vierwochen
      - --image=europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID
      - --region=europe-west3
      - --platform=managed
      - --service-account=vierwochen-app@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=5
      - --memory=512Mi
      - --cpu=1
      - --timeout=120s
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=europe-west4
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
