# Bau und Auslieferung von vierwochen.de
#
# Wird von einem Cloud-Build-Trigger bei jedem Push auf den Branch ausgefuehrt.
# Voraussetzung: Artifact-Registry-Repository "vierwochen" in europe-west3 und
# das Dienstkonto vierwochen-app (beides legt setup-gcp.sh an).

steps:
  - id: Bauen
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$SHORT_SHA
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:latest
      - .

  - id: Hochladen
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - --all-tags
      - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app

  - id: Ausliefern
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - vierwochen
      - --image=europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$SHORT_SHA
      - --region=europe-west3
      - --platform=managed
      - --service-account=vierwochen-app@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=5
      - --memory=512Mi
      - --cpu=1
      - --timeout=120s
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=europe-west4

images:
  - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

timeout: 1200s
