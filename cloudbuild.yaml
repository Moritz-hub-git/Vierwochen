# Bau und Auslieferung von vierwochen.de
#
# Laeuft bei jedem Push auf main. Bewusst defensiv gebaut: Der erste Schritt
# legt die Container-Ablage an, falls sie fehlt — genau daran ist der Build
# zuvor gescheitert. Keine Sonder-Maschinentypen, keine Annahmen ueber
# vorhandene Ressourcen.

steps:
  - id: Ablage-pruefen
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        if ! gcloud artifacts repositories describe vierwochen \
              --location=europe-west3 >/dev/null 2>&1; then
          echo "Artifact-Registry-Ablage fehlt — wird angelegt."
          gcloud artifacts repositories create vierwochen \
            --repository-format=docker \
            --location=europe-west3 \
            --description="Container der vierwochen-Anwendung"
        else
          echo "Ablage vorhanden."
        fi

  - id: Bauen
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID
      - .

  - id: Hochladen
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID

  - id: Ausliefern
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - vierwochen
      - --image=europe-west3-docker.pkg.dev/$PROJECT_ID/vierwochen/app:$BUILD_ID
      - --region=europe-west3
      - --platform=managed
      - --service-account=vierwochen-app@$PROJECT_ID.iam.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=5
      - --memory=512Mi
      - --cpu=1
      - --timeout=120s
      - --set-env-vars=GOOGLE_CLOUD_PROJECT=$PROJECT_ID,VERTEX_LOCATION=europe-west4
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1800s
